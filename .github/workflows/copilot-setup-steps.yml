name: Copilot Android setup validation

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - android/gradle/toolchain-lock.json
      - android/gradle/wrapper/**
      - tools/android-port/controller/ci.py
      - tools/android-port/controller/ci_environment.py
      - tools/android-port/controller/provision.py
  push:
    branches: [main]
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - tools/android-port/controller/ci.py
      - tools/android-port/controller/ci_environment.py
      - tools/android-port/controller/provision.py
      - android/gradle/toolchain-lock.json
      - android/gradle/wrapper/**

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 59
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.4"
          architecture: x64
      - name: Declare ephemeral cloud inputs
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'meshcoreone-cloud'
          "ANDROID_CI_OUTPUT=$(Join-Path $root 'evidence')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_CI_STATE=$(Join-Path (Join-Path $root 'toolchain') 'environment.json')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install checksum-pinned verification tooling
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --no-deps --only-binary=:all: -r tools/android-port/controller/requirements-ci.txt --quiet
      - name: Explicit checksum-pinned SDK/JDK provisioning
        shell: pwsh
        run: python tools/android-port/controller/ci.py provision --root (Split-Path $env:ANDROID_CI_STATE -Parent) --accept-sdk-license
      - name: Prepare process-only environment for later workers
        shell: pwsh
        run: |
          $state = Get-Content -Raw $env:ANDROID_CI_STATE | ConvertFrom-Json
          $values = @{
            JAVA_HOME = $state.java_home
            ANDROID_HOME = $state.android_home
            ANDROID_SDK_ROOT = $state.android_home
            GRADLE_USER_HOME = Join-Path $state.private_root 'gradle-root'
            ANDROID_USER_HOME = Join-Path $state.private_root 'android-user'
          }
          foreach ($name in $values.Keys) {
            "$name=$($values[$name])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
          (Join-Path $state.java_home 'bin') | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - name: Worker readiness is mandatory even if cloud setup previously failed
        run: python tools/android-port/controller/ci.py preflight
      - name: Resolve actual scaffold dependencies in strict mode
        run: python tools/android-port/controller/ci.py run --stage prepare
      - name: Preserve setup evidence, not a cloud-assignability receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cloud-setup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ANDROID_CI_OUTPUT }}
          if-no-files-found: error
          retention-days: 7
