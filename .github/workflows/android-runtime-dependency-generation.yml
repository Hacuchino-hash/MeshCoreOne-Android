# AndroidOnly: WP-207 Coordinator-admitted bounded owned dependency DATA proposal, not a test gate.
name: Android runtime dependency proposal

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: runtime-dependency-proposal-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  runtime-lock:
    if: >-
      github.repository == 'cbattlegear/MeshCoreOne-Android' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'cbattlegear-connection-runtime-ownership' &&
      startsWith(github.event.pull_request.title, '[WP-207] ')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Exact candidate, no persisted checkout credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.4"
          architecture: x64
      - name: Positive adversarial proposal checks
        run: python -B -m unittest discover -s android/core/runtime/verification -p 'test_dependency_proposal.py' -v
      - name: Provision unchanged checksum-pinned toolchain in a fresh private directory
        run: >-
          python tools/android-port/controller/ci.py provision
          --root "${{ runner.temp }}/wp207-runtime-proposal/toolchain" --accept-sdk-license
      - name: Generate only the owned runtime lock as data, with no source test claim
        run: >-
          python android/core/runtime/verification/dependency_proposal.py
          --state "${{ runner.temp }}/wp207-runtime-proposal/toolchain/environment.json"
          --output "${{ runner.temp }}/wp207-runtime-proposal/evidence"
      - name: Retain actual lock, graph, binding, inputs and command logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-lock-proposal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wp207-runtime-proposal/evidence
          if-no-files-found: error
          retention-days: 7
