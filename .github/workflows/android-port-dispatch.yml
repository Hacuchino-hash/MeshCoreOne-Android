name: Android port dispatch preview (paused)

on:
  workflow_dispatch:
    inputs:
      work_package:
        description: Approved WP to preview, never launch
        required: true
        default: WP-001
        type: string

permissions:
  contents: read

concurrency:
  group: android-port-controller
  cancel-in-progress: false

jobs:
  preview:
    name: Trusted dry-run preview only
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    env:
      WORK_PACKAGE: ${{ inputs.work_package }}
      ANDROID_PORT_DISPATCH_MODE: off
      ANDROID_PORT_PAUSED: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python tools/android-port/controller/dispatch.py --dry-run cloud --wp "$WORK_PACKAGE"
