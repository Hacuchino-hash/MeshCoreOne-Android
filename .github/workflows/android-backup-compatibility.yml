name: Android compatible manual backups

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-backup-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kotlin-producer:
    name: WP-203 real Kotlin Room export
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Read-only exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.4"
          architecture: x64
      - name: Install existing checksum-pinned workflow parser
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --no-deps --only-binary=:all: -r tools/android-port/controller/requirements-ci.txt --quiet
      - name: Source and collector negative assertions
        run: |
          python tools/android-port/test_inventory.py --check
          python tools/android-port/extract_vectors.py --check
          python -m unittest discover -s docs/android/evidence/WP-202 -p test_collect_evidence.py -q
          python -m unittest discover -s docs/android/evidence/WP-203 -p test_collect_evidence.py -q
          python -m unittest discover -s tools/android-port/oracle/tests -p test_wp203_*.py -q
      - name: Provision the unchanged isolated pinned SDK and JDK
        run: >-
          python tools/android-port/controller/ci.py provision
          --root "${{ runner.temp }}/wp203-producer-toolchain" --accept-sdk-license
      - name: Execute the complete real native producer suite
        run: >-
          python tools/android-port/oracle/wp203_ci.py producer
          --state "${{ runner.temp }}/wp203-producer-toolchain/environment.json"
          --output "${{ runner.temp }}/wp203-producer"
      - name: Preserve actual data, full XML and provenance only
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wp203-producer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wp203-producer
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false

  swift-restore-export:
    name: WP-203 actual SwiftData restore and export
    needs: kotlin-producer
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Read-only exact candidate and frozen source objects
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.4"
      - name: Download same-run data-only Kotlin artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wp203-producer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wp203-kotlin-input
      - name: Compile frozen production and execute real SwiftData restore
        run: >-
          python tools/android-port/oracle/wp203_interop.py
          --input "${{ runner.temp }}/wp203-kotlin-input"
          --output "${{ runner.temp }}/wp203-swift"
          --stage-root "${{ runner.temp }}/wp203-frozen-source"
      - name: Preserve Swift output, raw results and source provenance only
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wp203-swift-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/wp203-swift/*.json
            ${{ runner.temp }}/wp203-swift/*.xml
            ${{ runner.temp }}/wp203-swift/*.meshcoreone
            ${{ runner.temp }}/wp203-swift/*.log
            ${{ runner.temp }}/wp203-swift/reference-codec/*.json
            ${{ runner.temp }}/wp203-swift/reference-codec/*.meshcoreone
            ${{ runner.temp }}/wp203-swift/reference-codec/*.log
            ${{ runner.temp }}/wp203-swift/reference-codec/sources/source-map.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false

  kotlin-consumer:
    name: WP-203 real Room restore of Swift export
    needs: swift-restore-export
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Read-only exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.4"
          architecture: x64
      - name: Install existing checksum-pinned workflow parser
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --no-deps --only-binary=:all: -r tools/android-port/controller/requirements-ci.txt --quiet
      - name: Download same-run data-only actual Swift output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wp203-swift-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wp203-swift-input
      - name: Provision unchanged isolated pinned SDK and JDK
        run: >-
          python tools/android-port/controller/ci.py provision
          --root "${{ runner.temp }}/wp203-consumer-toolchain" --accept-sdk-license
      - name: Execute actual Room restore and compare Swift semantics
        run: >-
          python tools/android-port/oracle/wp203_ci.py consumer
          --state "${{ runner.temp }}/wp203-consumer-toolchain/environment.json"
          --input "${{ runner.temp }}/wp203-swift-input"
          --output "${{ runner.temp }}/wp203-consumer"
      - name: Preserve full consumer XML, actual data and evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wp203-consumer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wp203-consumer
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
