# AndroidOnly: WP-304 Exact coordinator-admitted UI dependency DATA proposal, never a native test or gate.
name: Android shared UI dependency proposal

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: shared-ui-dependency-proposal-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    name: WP-304 owned UI lock proposal
    if: >-
      github.repository == 'cbattlegear/MeshCoreOne-Android' &&
      github.event.pull_request.number == 33 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'cbattlegear-refactored-spoon' &&
      startsWith(github.event.pull_request.title, '[WP-304] ')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Read-only exact candidate checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.4"
          architecture: x64
      - name: Install only the existing checksum-pinned workflow parser
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --no-deps --only-binary=:all: -r tools/android-port/controller/requirements-ci.txt --quiet
      - name: Validate exact boundary and positive adversarial discovery
        run: python -B android/core/ui/verification/dependency_proposal.py --self-test --workflow-check
      - name: Generate only owned UI lock bytes as a data proposal
        run: >-
          python -B android/core/ui/verification/dependency_proposal.py
          --run --root "${{ runner.temp }}/wp304-ui-generation"
      - name: Retain complete generated bytes and immutable failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wp304-ui-lock-proposal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wp304-ui-generation/proposal
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
