name: Android scaffold CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Classify full Android scaffold inputs
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - name: Read-only exact candidate checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        name: Classify immutable event endpoints
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
        run: python tools/android-port/controller/scaffold_scope.py --event-name "$EVENT_NAME" --event-path "$EVENT_PATH" --output "$GITHUB_OUTPUT"

  build:
    name: Android scaffold
    needs: [scope]
    if: ${{ needs.scope.outputs.full == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Read-only exact candidate checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.4"
          architecture: x64
      - name: Install checksum-pinned workflow parser
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --no-deps --only-binary=:all: -r tools/android-port/controller/requirements-ci.txt --quiet
      - name: Declare private per-job inputs and evidence
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'meshcoreone-ci'
          "ANDROID_CI_OUTPUT=$(Join-Path $root 'evidence')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_CI_STATE=$(Join-Path (Join-Path $root 'toolchain') 'environment.json')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Frozen inventory, workflow boundaries and positive Python discovery
        run: python tools/android-port/controller/ci.py python
      - name: Provision exact first-party JDK and actual SDK 37.2 archives
        run: python tools/android-port/controller/ci.py provision --root (Split-Path $env:ANDROID_CI_STATE -Parent) --accept-sdk-license
      - name: Independent worker-readiness check
        run: python tools/android-port/controller/ci.py preflight
      - name: Fresh strict composite assertions, graph, Room and runtime inputs
        run: python tools/android-port/controller/ci.py run --stage verify
      - name: Retain complete validated localization JUnit evidence
        run: >-
          python tools/android-port/l10n_convert.py --check
          --verify-android-tests android/core/l10n/build/test-results/testDebugUnitTest
          --copy-android-junit (Join-Path (Join-Path $env:ANDROID_CI_OUTPUT 'l10n') 'junit')
      - name: Independent fresh strict included-build assertions
        run: python tools/android-port/controller/ci.py run --stage standalone
      - name: Assemble actual debug APK
        run: python tools/android-port/controller/ci.py run --stage assemble
      - name: Lint every Android scaffold target
        run: python tools/android-port/controller/ci.py run --stage lint
      - name: Inspect exact APK, notices, fixture absence and static 16KB alignment
        run: python tools/android-port/controller/ci.py inspect
      - name: Preserve debug APK and complete digest-bound scaffold evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scaffold-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ANDROID_CI_OUTPUT }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false

  android-ci:
    name: android-ci
    if: ${{ always() }}
    needs: [scope, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.4"
          architecture: x64
      - name: Read this run's untrusted build bundle as data
        if: ${{ needs.scope.outputs.full == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: scaffold-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scaffold-results
      - name: Fail closed on job outcomes, discovery or stale/artifact evidence
        if: ${{ always() }}
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: |
          if [ "${{ needs.scope.outputs.full }}" = "false" ]; then
            test "${{ needs.build.result }}" = "skipped"
            echo "Change-scoped Android scaffold: no full inputs changed."
          else
            python tools/android-port/controller/ci.py aggregate --artifacts "${{ runner.temp }}/scaffold-results"
          fi
