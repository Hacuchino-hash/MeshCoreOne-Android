name: Android protocol parity

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-protocol-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: Protocol JVM parity (${{ matrix.host }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux
            runner: ubuntu-24.04
          - host: windows
            runner: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.4"
          architecture: x64
      - name: Declare private protocol inputs and evidence
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'meshcoreone-protocol'
          "ANDROID_CI_OUTPUT=$(Join-Path $root 'evidence')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_CI_STATE=$(Join-Path (Join-Path $root 'toolchain') 'environment.json')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Provision the verified build toolchain
        run: python tools/android-port/controller/ci.py provision --root (Split-Path $env:ANDROID_CI_STATE -Parent) --accept-sdk-license
      - name: Validate actual worker inputs
        run: python tools/android-port/controller/ci.py preflight
      - name: Execute all protocol assertions in strict mode
        run: python tools/android-port/controller/ci.py run --stage protocol
      - name: Preserve raw protocol reports and command evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protocol-${{ matrix.host }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.ANDROID_CI_OUTPUT }}
            android/core/protocol/build/test-results/test/
          if-no-files-found: error
          retention-days: 7
