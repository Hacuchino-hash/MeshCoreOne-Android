name: Android independent parity and compatibility checks

# Coordinator consolidation (session bcb17a74-5fa6-47d0-a4be-b6b595e20559):
# merges the formerly-separate android-parity-foundation.yml (WP-004),
# android-protocol.yml and android-backup-compatibility.yml (WP-203) into one
# workflow so a single shared preflight gates every expensive job via `needs:`.
# Cross-file `needs:` is not possible in GitHub Actions, so true fail-fast
# across these checks requires them to live in one file. See
# docs/android/deviations/WP-003.md for the authorization note.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-independent-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Classify immutable auxiliary parity inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      helpers: ${{ steps.changed.outputs.helpers }}
      codec: ${{ steps.changed.outputs.codec }}
      protocol: ${{ steps.changed.outputs.protocol }}
      backup: ${{ steps.changed.outputs.backup }}
    steps:
      - name: Read-only exact candidate and immutable diff endpoints
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify actual auxiliary inputs with fail-safe defaults
        id: changed
        run: >-
          python tools/android-port/oracle/workflow_scope.py
          --event-name "${{ github.event_name }}"
          --event-path "${{ github.event_path }}"
          --output "$GITHUB_OUTPUT"

  preflight:
    name: Shared frozen inventory and vector drift gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read-only exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.4"
          architecture: x64
      - name: Install existing checksum-pinned workflow parser
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --no-deps --only-binary=:all: -r tools/android-port/controller/requirements-ci.txt --quiet
      - name: Frozen inventory and independent-vector drift
        run: |
          python tools/android-port/test_inventory.py --check
          python tools/android-port/extract_vectors.py --check

  helpers:
    name: WP-004 Python and Kotlin assertions
    needs: [preflight, scope]
    if: ${{ needs.scope.outputs.helpers == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Read-only exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.4"
          architecture: x64
      - name: Install existing checksum-pinned workflow parser
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --no-deps --only-binary=:all: -r tools/android-port/controller/requirements-ci.txt --quiet
      - name: Actual new Python assertions with positive discovery
        run: >-
          python tools/android-port/oracle/run_tests.py
          --output "${{ runner.temp }}/wp004-python.json"
      - name: Declare isolated exact toolchain inputs
        run: |
          echo "ANDROID_CI_STATE=${{ runner.temp }}/wp004-toolchain/environment.json" >> "$GITHUB_ENV"
          echo "ANDROID_CI_OUTPUT=${{ runner.temp }}/wp004-kotlin" >> "$GITHUB_ENV"
      - name: Reuse pinned archive-only provisioning
        run: >-
          python tools/android-port/controller/ci.py provision
          --root "${{ runner.temp }}/wp004-toolchain" --accept-sdk-license
      - name: Actual core-testing suite and production isolation graph
        run: python tools/android-port/oracle/foundation_ci.py kotlin
      - name: Preserve assertion XML and evidence, never executable artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wp004-helpers-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/wp004-python.json
            ${{ runner.temp }}/wp004-kotlin
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false

  reference-codec:
    name: WP-004 actual Swift codec oracle
    needs: [preflight, scope]
    if: ${{ needs.scope.outputs.codec == 'true' }}
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Read-only candidate and frozen source objects
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.4"
      - name: Compile and execute real pinned source codecs and independent crypto
        run: >-
          python tools/android-port/oracle/codec_harness.py run
          --output "${{ runner.temp }}/wp004-codec"
      - name: Preserve data, source provenance and actual logs only
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wp004-codec-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/wp004-codec/*.json
            ${{ runner.temp }}/wp004-codec/*.meshcoreone
            ${{ runner.temp }}/wp004-codec/*.log
            ${{ runner.temp }}/wp004-codec/sources/source-map.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false

  protocol:
    name: Protocol JVM parity
    needs: [preflight, scope]
    if: ${{ needs.scope.outputs.protocol == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.4"
          architecture: x64
      - name: Declare private protocol inputs and evidence
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'meshcoreone-protocol'
          "ANDROID_CI_OUTPUT=$(Join-Path $root 'evidence')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_CI_STATE=$(Join-Path (Join-Path $root 'toolchain') 'environment.json')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Provision the verified build toolchain
        run: python tools/android-port/controller/ci.py provision --root (Split-Path $env:ANDROID_CI_STATE -Parent) --accept-sdk-license
      - name: Validate actual worker inputs
        run: python tools/android-port/controller/ci.py preflight
      - name: Execute all protocol assertions in strict mode
        run: python tools/android-port/controller/ci.py run --stage protocol
      - name: Preserve raw protocol reports and command evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protocol-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.ANDROID_CI_OUTPUT }}
            android/core/protocol/build/test-results/test/
          if-no-files-found: error
          retention-days: 7

  kotlin-producer:
    name: WP-203 real Kotlin Room export
    needs: [preflight, scope]
    if: ${{ needs.scope.outputs.backup == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Read-only exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.4"
          architecture: x64
      - name: Install existing checksum-pinned workflow parser
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --no-deps --only-binary=:all: -r tools/android-port/controller/requirements-ci.txt --quiet
      - name: WP-203 collector and oracle negative assertions
        run: |
          python -m unittest discover -s docs/android/evidence/WP-202 -p test_collect_evidence.py -q
          python -m unittest discover -s docs/android/evidence/WP-203 -p test_collect_evidence.py -q
          python -m unittest discover -s tools/android-port/oracle/tests -p test_wp203_*.py -q
      - name: Provision the unchanged isolated pinned SDK and JDK
        run: >-
          python tools/android-port/controller/ci.py provision
          --root "${{ runner.temp }}/wp203-producer-toolchain" --accept-sdk-license
      - name: Execute the complete real native producer suite
        run: >-
          python tools/android-port/oracle/wp203_ci.py producer
          --state "${{ runner.temp }}/wp203-producer-toolchain/environment.json"
          --output "${{ runner.temp }}/wp203-producer"
      - name: Preserve actual data, full XML and provenance only
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wp203-producer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wp203-producer
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false

  swift-restore-export:
    name: WP-203 actual SwiftData restore and export
    needs: [scope, kotlin-producer]
    if: ${{ needs.scope.outputs.backup == 'true' }}
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Read-only exact candidate and frozen source objects
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.4"
      - name: Download same-run data-only Kotlin artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wp203-producer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wp203-kotlin-input
      - name: Compile frozen production and execute real SwiftData restore
        run: >-
          python tools/android-port/oracle/wp203_interop.py
          --input "${{ runner.temp }}/wp203-kotlin-input"
          --output "${{ runner.temp }}/wp203-swift"
          --stage-root "${{ runner.temp }}/wp203-frozen-source"
      - name: Preserve Swift output, raw results and source provenance only
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wp203-swift-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/wp203-swift/*.json
            ${{ runner.temp }}/wp203-swift/*.xml
            ${{ runner.temp }}/wp203-swift/*.meshcoreone
            ${{ runner.temp }}/wp203-swift/*.log
            ${{ runner.temp }}/wp203-swift/reference-codec/*.json
            ${{ runner.temp }}/wp203-swift/reference-codec/*.meshcoreone
            ${{ runner.temp }}/wp203-swift/reference-codec/*.log
            ${{ runner.temp }}/wp203-swift/reference-codec/sources/source-map.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false

  kotlin-consumer:
    name: WP-203 real Room restore of Swift export
    needs: [scope, swift-restore-export]
    if: ${{ needs.scope.outputs.backup == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Read-only exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.4"
          architecture: x64
      - name: Install existing checksum-pinned workflow parser
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --no-deps --only-binary=:all: -r tools/android-port/controller/requirements-ci.txt --quiet
      - name: Download same-run data-only actual Swift output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wp203-swift-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wp203-swift-input
      - name: Provision unchanged isolated pinned SDK and JDK
        run: >-
          python tools/android-port/controller/ci.py provision
          --root "${{ runner.temp }}/wp203-consumer-toolchain" --accept-sdk-license
      - name: Execute actual Room restore and compare Swift semantics
        run: >-
          python tools/android-port/oracle/wp203_ci.py consumer
          --state "${{ runner.temp }}/wp203-consumer-toolchain/environment.json"
          --input "${{ runner.temp }}/wp203-swift-input"
          --output "${{ runner.temp }}/wp203-consumer"
      - name: Preserve full consumer XML, actual data and evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wp203-consumer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wp203-consumer
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
