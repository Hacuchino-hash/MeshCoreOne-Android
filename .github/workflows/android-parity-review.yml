name: Android parity staging preview (paused)

on:
  workflow_dispatch:
    inputs:
      work_package:
        description: Stage trusted acceptance inputs only; no reviewer launch or check publishing
        required: true
        default: WP-000
        type: string
      candidate_sha:
        description: Full immutable already-fetched candidate; data only, never executed
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-port-controller
  cancel-in-progress: false

jobs:
  staging:
    name: Dry-run staging (not parity-review)
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    env:
      WORK_PACKAGE: ${{ inputs.work_package }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      ANDROID_PORT_DISPATCH_MODE: off
      ANDROID_PORT_PAUSED: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.4"
      - run: python tools/android-port/controller/dispatch.py --dry-run render --wp "$WORK_PACKAGE"
      - name: Stage trusted-base profile, skills, reference and complete candidate data
        run: python tools/android-port/controller/gate_runtime.py stage --wp "$WORK_PACKAGE" --trusted-base "$GITHUB_SHA" --candidate "$CANDIDATE_SHA" --output "$RUNNER_TEMP/reviewer-input.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reviewer-staging-data-only
          path: ${{ runner.temp }}/reviewer-input.json
          if-no-files-found: error
          retention-days: 7
      - name: Missing isolated reviewer/publisher is BLOCKED, never parity-review PASS
        run: python tools/android-port/controller/gate_runtime.py capabilities
