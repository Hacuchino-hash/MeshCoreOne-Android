name: Android port work package
description: One approved, bounded WP; issue creation does not authorize dispatch.
title: "[WP-xxx] "
body:
  - type: markdown
    attributes:
      value: |
        Use the approved plan/manifest. Bootstrap stays off/paused; WPs000-003 are supervised.
        A closed issue is not completion. Do not file the backlog or assign Copilot during WP-000.
  - type: input
    id: wp
    attributes:
      label: Approved work package
      placeholder: WP-101
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: Controller-rendered prompt and exact scope
      description: Paste render output including the real android-port-wp marker, pinned inputs, owner, dependencies, all write paths and acceptance.
      placeholder: python .\tools\android-port\controller\dispatch.py render --wp WP-101
    validations:
      required: true
  - type: textarea
    id: authorization
    attributes:
      label: Authorization, dependencies and existing identities
      description: Link real merged prerequisite PRs/evidence and any existing task/session/PR. Name human or protected-path gates and blockers; do not fabricate approvals.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification and stop conditions
      description: Actual commands/test-discovery requirements, original case families and platform/oracle/hardware evidence. Missing configured commands is a blocker.
    validations:
      required: true
